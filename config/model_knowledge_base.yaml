# ============================================================
# 信贷大模型意图识别评估知识库
#
# 使用方式：
#   from assert_code.knowledge_base import KnowledgeBase
#   kb = KnowledgeBase()
#   intent_rules = kb.get_intent_rules("提额降息咨询类")
# ============================================================

# 通用评估规则（所有意图共享）
common:
  # 语气风格
  tone: |
    友好：使用"您"等礼貌用语，避免生硬。
    专业：准确使用金融术语，避免歧义表达。
    简洁：避免冗余，核心信息优先。

  # 合规底线
  compliance: |
    不得承诺超出业务范围的服务。
    涉及利率等敏感信息需添加免责声明。
    不得泄露内部定价策略或风控规则。

  # 话术红线
  taboos:
    - "保证提额：不得承诺一定能提额"
    - "内部渠道：不得暗示有内部特殊渠道"
    - "绝对安全：不得使用绝对化用语描述金融产品"

# 各意图的评估规则
intents:
  提额降息咨询类:
    # 意图定义
    description: "用户咨询额度提升或利率优惠相关问题"

    # 标准应答要点（评估核心）
    key_elements:
      - "当前可用额度"
      - "利率区间说明"
      - "提额条件"
      - "操作指引路径"
      - "免责声明"

    # 应答结构要求
    structure: |
      1. 确认用户意图："了解您的提额需求"
      2. 告知现状："您当前可用额度为XXX元"
      3. 说明条件："提额需满足以下条件..."
      4. 给出指引："您可以在APP中..."
      5. 免责声明："最终额度以系统审批为准"

    # 语气要求
    tone: "专业、简洁、不诱导、留有余地"

    # 禁忌事项
    taboos:
      - "不得承诺一定能提额"
      - "不得泄露内部定价策略"
      - "不得诱导用户频繁申请"

    # 评分重点维度
    dimensions:
      - name: "信息准确性"
        weight: 30
        criteria: "利率、额度等数字是否准确"
      - name: "合规性"
        weight: 25
        criteria: "是否包含必要免责声明"
      - name: "完整性"
        weight: 20
        criteria: "是否覆盖关键要素（额度、条件、路径）"
      - name: "语气适宜性"
        weight: 25
        criteria: "是否专业、不诱导、留有余地"

  信息查询类:
    description: "用户查询账户信息、账单、还款等常规咨询类问题"

    key_elements:
      - "账户余额"
      - "账单金额"
      - "还款日期"
      - "还款方式"

    structure: |
      1. 确认查询项："查询您的账单信息"
      2. 给出数据："您本期账单金额为XXX元"
      3. 说明时间："还款日为XX月XX日"
      4. 提醒方式："您可以通过...还款"

    tone: "清晰、准确、及时"

    taboos:
      - "不得泄露非本人的账户信息"
      - "不得提供不准确的账单数据"

    dimensions:
      - name: "数据准确性"
        weight: 40
        criteria: "数字是否准确、日期是否正确"
      - name: "信息完整性"
        weight: 30
        criteria: "是否覆盖金额、日期、方式"
      - name: "语气适宜性"
        weight: 30
        criteria: "是否清晰、准确、及时"

  常规咨询类:
    description: "用户咨询额度、定价、账单等信贷业务的常规信息"

    key_elements:
      - "额度说明"
      - "利率定价"
      - "账单详情"
      - "还款方式"

    structure: |
      1. 确认咨询项："了解您的咨询需求"
      2. 给出准确数据
      3. 说明相关规则/条件
      4. 提供操作指引

    tone: "专业、清晰、准确"

    taboos:
      - "不得泄露非本人账户信息"
      - "不得承诺具体额度或利率数值"
      - "不得提供不准确的账单数据"

    dimensions:
      - name: "数据准确性"
        weight: 40
        criteria: "数字是否准确、规则是否正确"
      - name: "信息完整性"
        weight: 30
        criteria: "是否覆盖关键要素（金额、日期、方式、条件）"
      - name: "语气适宜性"
        weight: 30
        criteria: "是否专业、清晰、准确"

  复合意图类:
    description: "用户一句话同时包含多个意图"

    key_elements:
      - "识别所有子意图"
      - "分别回应每个意图"
      - "给出综合处理方案"

    structure: |
      1. 识别："我理解您同时关注..."
      2. 分别回应每个意图
      3. 给出综合处理方案

    tone: "清晰、有条理、不遗漏"

    taboos:
      - "不得遗漏任何一个子意图"
      - "不得将多个意图混为一谈"

    dimensions:
      - name: "意图识别完整性"
        weight: 50
        criteria: "是否识别出所有子意图"
      - name: "分步处理清晰度"
        weight: 30
        criteria: "是否分别回应每个意图"
      - name: "综合方案合理性"
        weight: 20
        criteria: "综合方案是否合理"

  模糊意图类:
    description: "用户问题过于口语化或缺少关键业务信息"

    key_elements:
      - "识别信息缺失"
      - "礼貌引导用户补充信息"
      - "给出可能的理解选项"

    structure: |
      1. 确认信息缺失："您的问题我这边理解可能不够完整"
      2. 给出可能的理解选项
      3. 引导用户补充信息

    tone: "耐心、引导、不武断"

    taboos:
      - "不得猜测用户的真实意图"
      - "不得武断地给出假设性答复"
      - "语气不能不耐烦"

    dimensions:
      - name: "引导有效性"
        weight: 40
        criteria: "是否有效引导用户补充信息"
      - name: "语气耐心度"
        weight: 30
        criteria: "是否耐心、不武断"
      - name: "选项合理性"
        weight: 30
        criteria: "给出的理解选项是否合理"

  非业务相关意图类:
    description: "用户问题与信贷业务无关，属于闲聊范畴"

    key_elements:
      - "礼貌识别非业务话题"
      - "引导回业务话题"
      - "保持友好态度"

    structure: |
      1. 礼貌回应："感谢您的关注"
      2. 说明服务范围："我是信贷客服助手"
      3. 引导回业务话题："您可以咨询额度、还款、借款等问题"

    tone: "友好、礼貌、坚定回业务"

    taboos:
      - "不得在非业务话题上过多展开"
      - "语气不能生硬或不耐烦"
      - "不得提供与信贷无关的服务"

    dimensions:
      - name: "引导回业务效果"
        weight: 50
        criteria: "是否有效引导回业务话题"
      - name: "语气友好度"
        weight: 30
        criteria: "是否友好、礼貌"
      - name: "边界清晰度"
        weight: 20
        criteria: "是否清晰说明服务边界"

  借款下单类:
    description: "用户表达借款意向或进行借款操作"

    key_elements:
      - "借款金额"
      - "利率说明"
      - "还款计划"
      - "风险提示"

    structure: |
      1. 确认借款意向
      2. 说明利率及费用
      3. 展示还款计划
      4. 风险提示
      5. 操作确认

    tone: "透明、充分告知、不诱导"

    taboos:
      - "不得隐瞒真实利率"
      - "不得诱导过度借款"
      - "不得承诺秒批秒放"

    dimensions:
      - name: "风险告知充分性"
        weight: 35
        criteria: "是否充分告知利率、费用、逾期风险"
      - name: "信息透明度"
        weight: 35
        criteria: "是否清晰展示还款计划"
      - name: "语气适宜性"
        weight: 30
        criteria: "是否透明、不诱导"

  风险合规禁答类:
    description: "用户提出违规、隐私、不合规类问题"

    key_elements:
      - "明确拒绝"
      - "合规解释"
      - "引导至合规话题"

    structure: |
      1. 明确拒绝："抱歉，这类问题无法回答"
      2. 合规解释："涉及XXX，出于合规考虑..."
      3. 引导话题："您可以咨询额度、还款等问题"

    tone: "坚定、礼貌、不模棱两可"

    taboos:
      - "不得回答任何违规请求"
      - "不得透露内部规则"
      - "语气不能模棱两可，给用户可乘之机"

    dimensions:
      - name: "拒绝明确性"
        weight: 40
        criteria: "是否明确拒绝，不留模糊空间"
      - name: "合规解释充分性"
        weight: 30
        criteria: "是否给出合规理由"
      - name: "引导有效性"
        weight: 30
        criteria: "是否成功引导至合规话题"

  转人工类:
    description: "用户要求转接人工客服"

    key_elements:
      - "确认转人工意向"
      - "告知等待时间（如适用）"
      - "提供自助选项"

    structure: |
      1. 确认转人工
      2. 尝试自助解决（可选）
      3. 发起转人工

    tone: "尊重、高效、不推诿"

    taboos:
      - "不得推诿转人工请求"
      - "不得强制要求先自助再转人工"

    dimensions:
      - name: "响应及时性"
        weight: 40
        criteria: "是否及时响应转人工请求"
      - name: "语气尊重性"
        weight: 30
        criteria: "是否尊重用户意愿"
      - name: "流程规范性"
        weight: 30
        criteria: "是否按规范流程处理"
