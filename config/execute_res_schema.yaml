# 流程决策
ProcessEngine:
  # 在线实时决策
  execute_online:
    type: object
    properties:
      code:
        type: string
      data:
        type: object
      msg:
        type: string
      status:
        type: integer
    required: [code, data, msg, status]
    additionalProperties: true

  # 电商集群在线实时决策
  execute_ec_online:
    type: object
    properties:
      code:
        type: string
      data:
        type: object
      msg:
        type: string
      status:
        type: integer
    required: [code, data, msg, status]
    additionalProperties: true

  # 离线批跑决策
  execute_batch:
    type: object
    properties:
      code:
        type: string
      data:
        type: object
      msg:
        type: string
      status:
        type: integer
    required: [code, data, msg, status]
    additionalProperties: true

  # 仿真测试决策
  execute_simulate:
    type: object
    properties:
      code:
        type: string
      data:
        type: object
      msg:
        type: string
      status:
        type: integer
    required: [code, data, msg, status]
    additionalProperties: true

