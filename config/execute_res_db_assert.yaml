# 流程决策
ProcessEngine:
  # 在线实时决策
  execute_online:
    instance_name: processenginedb
    db_info:
      sql_type: "select"
      target_column: "*"
      target_table: "process_instance_##_db.t_process_instance_result_#"
      condition: "finstance_id = '{}'"
      key_indicator: "finstance_id"
      order_by: False
      ret_col:
        - Fcode
        - Fstatus
        - Fdata
    ck_info:
      sql_type: "select"
      target_column: "*"
      target_table: "risk_control_base_db.t_element_decision_log"
      condition: "finstance_id = '{0}'"
      ret_col:
        - felement_id
        - fpackage_id

    # 电商在线实时决策
    execute_ec_online:
      instance_name: processengineecdb
      db_info:
        sql_type: "select"
        target_column: "*"
        target_table: "process_instance_##_db.t_process_instance_result_#"
        condition: "finstance_id = '{}'"
        key_indicator: "finstance_id"
        order_by: False
        ret_col:
          - Fcode
          - Fstatus
          - Fdata
      ck_info:
        sql_type: "select"
        target_column: "*"
        target_table: "risk_control_base_db.t_element_decision_log"
        condition: "finstance_id = '{0}'"
        ret_col:
          - felement_id
          - fpackage_id

  # 离线批跑决策
  execute_batch:
    instance_name: processenginebdb
    db_info:
      sql_type: "select"
      target_column: "*"
      target_table: "process_instance_##_db.t_process_instance_result_#"
      condition: "finstance_id = '{}'"
      key_indicator: "finstance_id"
      order_by: False
      ret_col:
        - Fcode
        - Fstatus
        - Fdata
    ck_info:
      sql_type: "select"
      target_column: "*"
      target_table: "risk_control_base_db.t_element_decision_log"
      condition: "finstance_id = '{0}'"
      ret_col:
        - felement_id
        - fpackage_id

  # 仿真测试决策
  execute_simulate:
    instance_name: processenginesdb
    db_info:
      sql_type: "select"
      target_column: "*"
      target_table: "process_instance_##_db.t_process_instance_result_#"
      condition: "finstance_id = '{}'"
      key_indicator: "finstance_id"
      order_by: False
      ret_col:
        - Fcode
        - Fstatus
        - Fdata
      ck_info:
        sql_type: "select"
        target_column: "*"
        target_table: "risk_control_base_db.t_element_decision_log"
        condition: "finstance_id = '{0}'"
        ret_col:
          - felement_id
          - fpackage_id

