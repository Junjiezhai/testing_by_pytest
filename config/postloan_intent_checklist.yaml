# ============================================================
# 细粒度检查清单配置 — 贷后催收领域专业版
# ============================================================
# 设计说明：
#   基于贷后催收业务特点，将检查维度从信贷场景的6个调整为贷后专用6个维度，
#   覆盖催收合规、情绪安抚、问题解决等核心关注点。
#
# 调整方式：
#   1. 修改 dimensions 下的 items 列表增删检查项
#   2. 修改 threshold_strategy 切换阈值策略（relaxed/strict/balanced）
#   3. 新增/删除整个 dimension 节点可调整检查粒度
# ============================================================

checklist:
  # 检查清单描述
  description: "贷后催收话术细粒度检查清单"

  # 状态选项（模型返回的选项）
  status_options:
    - "是"
    - "否"
    - "部分"

  # 检查维度与检查项列表
  # 可按业务场景增删维度，或调整每个维度下的检查项
  dimensions:
    # ============================================================
    # 维度1：催收合规性
    # 核心关注点：催收话术是否符合监管要求，有无违规用语
    # 适用意图：全部贷后场景（一票否决项）
    # ============================================================
    - name: "催收合规性"
      key: "collection_compliance"
      items:
        - "无威胁/恐吓/辱骂等攻击性用语"
        - "无承诺减免/优惠等无法保证的内容"
        - "无虚假陈述/误导性信息"
        - "无诱导用户违规操作（如伪造材料）"
        - "未泄露用户隐私信息"

    # ============================================================
    # 维度2：情绪安抚
    # 核心关注点：对用户情绪的安抚和引导
    # 适用意图：全部贷后场景
    # ============================================================
    - name: "情绪安抚"
      key: "emotional_comfort"
      items:
        - "语气平和，未激化矛盾"
        - "对用户情绪进行了适当安抚"
        - "未使用命令式/强制式语气"
        - "话术体现了同理心和理解"

    # ============================================================
    # 维度3：问题解决有效性
    # 核心关注点：是否有效解决了用户的催收问题
    # 适用意图：协商还款、还款咨询、催收应对
    # ============================================================
    - name: "问题解决有效性"
      key: "problem_solving"
      items:
        - "明确告知了还款方案/选项"
        - "提供了可行的解决路径"
        - "引导用户完成还款操作"
        - "对用户的疑问进行了有效回应"

    # ============================================================
    # 维度4：信息准确性
    # 核心关注点：还款金额、日期、方式等信息是否准确
    # 适用意图：还款咨询、账户查询、还款协商
    # ============================================================
    - name: "信息准确性"
      key: "info_accuracy"
      items:
        - "还款金额/日期/方式准确"
        - "账户信息正确无误"
        - "无误导性信息"
        - "逾期费用计算正确"

    # ============================================================
    # 维度5：表达规范性
    # 核心关注点：话术专业度、清晰度、语气规范
    # 适用意图：全部贷后场景
    # ============================================================
    - name: "表达规范性"
      key: "expression"
      items:
        - "话术无歧义、用户易理解"
        - "专业术语已解释或用户可理解"
        - "语气符合客服规范（礼貌、客观、不强势）"
        - "回复长度适中、信息密度合理"

    # ============================================================
    # 维度6：隐私安全
    # 核心关注点：用户隐私信息保护
    # 适用意图：全部（一票否决项）
    # ============================================================
    - name: "隐私安全"
      key: "privacy_security"
      items:
        - "无隐私信息泄露"
        - "无敏感信息外泄"
        - "符合数据安全规范"
        - "未在公共渠道暴露用户个人信息"

# ============================================================
# 阈值策略配置
# ============================================================
# 说明：
#   - relaxed（标准宽松）：催收合规/隐私安全全"是"，其他无"否" → 通过
#   - strict（标准严格）：所有项全"是" → 通过
#   - balanced（平衡模式，推荐）：催收合规/隐私安全无"否" → 通过，其他"否"→条件通过
#
# 建议：
#   - 日常回归测试：balanced
#   - 上线前验收测试：strict
#   - 快速筛查/冒烟测试：relaxed
# ============================================================
threshold_strategy: "balanced"
