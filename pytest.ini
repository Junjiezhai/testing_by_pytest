# pytest.ini

[pytest]
markers =
    process   : 'process engine'
    process_online  : 'process_online_exec'
    process_ec_online  : 'process_ec_online_exec'
    process_batch  : 'process_batch_exec'
    package   : 'mihawk engine'
    package_online_exec_rcflow_decision  : 'package_online_exec_rcflow_decision'
    package_online_exec_make_decision  : 'package_online_exec_make_decision'
    package_online_exec_package_decision  : 'package_online_exec_package_decision'
    package_ec_online_exec_rcflow_decision  : 'package_ec_online_exec_rcflow_decision'
    package_ec_online_exec_make_decision  : 'package_ec_online_exec_make_decision'
    package_ec_online_exec_package_decision  : 'package_ec_online_exec_package_decision'
    package_batch_exec_rcflow_decision  : 'package_batch_exec_rcflow_decision'
    package_batch_exec_make_decision  : 'package_batch_exec_make_decision'
    package_batch_exec_package_decision  : 'package_batch_exec_package_decision'
    package_simulate_exec_rcflow_decision  : 'package_simulate_exec_rcflow_decision'
    feature_platform : 'feature platform'
    feature_field_batch : 'execute_field_batch_compute'
    feature_ruleengine_proxy : 'execute_ruleengine_proxy_compute'
    feature_simulate_proxy : 'execute_simulate_proxy_compute'
    feature_business_proxy : 'execute_business_proxy_compute'
    feature_offline_proxy : 'execute_offline_proxy_compute'
    model_intent_recognition : 'model intent recognition'
    model_single_turn : 'model single turn intent recognition'
    model_multi_turn : 'model multi turn dialog consistency'
    model_summary : 'model test summary report'

addopts = --strict-markers